<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica del 2do parcial, Análisis y Diseño de Sistemas II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --dp-color-ground:#fffdf5; --dp-color-panel:#ffffff; --dp-color-ink:#253044; --dp-color-outline:#252b3a;
  --dp-color-accent:#6434df; --dp-color-accent-secondary:#ff78c5; --dp-color-accent-warm:#ffd05b; --dp-color-accent-fresh:#9bf1cd;
  --dp-color-field-soft:#e9fff5; --dp-color-selection:#f1ebff; --dp-color-rule-muted:#b8b6c5;
  --dp-typography-display:"PlayfulGeometricDisplay","Host Grotesk",ui-sans-serif,system-ui,sans-serif;
  --dp-typography-reading:"PlayfulGeometricReading","Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --dp-typography-reading-compact:16px; --dp-typography-label:14px; --dp-typography-metadata:13px; --dp-typography-reading-leading:1.65;
  --dp-spacing-gap-compact:12px; --dp-radius-corner:17px; --dp-border-outline-width:3px; --dp-border-detail-width:2px; --dp-motion-interaction:180ms;
  --muted:#5a6273; --on-accent:#ffffff; --bad-soft:#ffe8f4; --warn-soft:#fff4d2;
  --petri:#6434df; --bi:#22b97f; --dm:#f0b020; --bd:#ff78c5;
  --shadow-ink:var(--dp-color-outline);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --dp-color-ground:#171b26; --dp-color-panel:#222838; --dp-color-ink:#eef0f8; --dp-color-outline:#aab2cc;
  --dp-color-accent:#9b7bff; --dp-color-field-soft:#16352b; --dp-color-selection:#2e2650; --dp-color-rule-muted:#4a5168;
  --muted:#aeb5c8; --on-accent:#14101f; --bad-soft:#3d2034; --warn-soft:#3a3220; --petri:#9b7bff; --shadow-ink:#05070c; } }
:root[data-theme="dark"]{
  --dp-color-ground:#171b26; --dp-color-panel:#222838; --dp-color-ink:#eef0f8; --dp-color-outline:#aab2cc;
  --dp-color-accent:#9b7bff; --dp-color-field-soft:#16352b; --dp-color-selection:#2e2650; --dp-color-rule-muted:#4a5168;
  --muted:#aeb5c8; --on-accent:#14101f; --bad-soft:#3d2034; --warn-soft:#3a3220; --petri:#9b7bff; --shadow-ink:#05070c; }
*{box-sizing:border-box}
html{background:var(--dp-color-ground)}
body{margin:0;background:var(--dp-color-ground);color:var(--dp-color-ink);font:400 var(--dp-typography-reading-compact)/var(--dp-typography-reading-leading) var(--dp-typography-reading);min-height:100vh}
button,input{font:inherit;color:inherit}
.i{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em;flex:none}
:focus-visible{outline:3px solid var(--dp-color-accent);outline-offset:6px;border-radius:10px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--dp-typography-display);letter-spacing:-.02em}
/* encabezado */
header{position:relative;z-index:5;background:var(--dp-color-ground);border-bottom:var(--dp-border-outline-width) solid var(--dp-color-outline)}
.htop{display:flex;align-items:center;gap:10px;padding-top:20px}
.htop h1{flex:1;margin:0;font-size:24px;line-height:1.1;font-weight:800}
.htop h1 small{display:block;margin-top:4px;font:500 var(--dp-typography-metadata)/1.3 var(--dp-typography-reading);color:var(--muted);letter-spacing:0}
.hbtn{display:inline-flex;align-items:center;gap:6px;background:var(--dp-color-panel);border:var(--dp-border-detail-width) solid var(--dp-color-outline);color:var(--dp-color-ink);border-radius:999px;padding:6px 13px;cursor:pointer;text-decoration:none;font-size:var(--dp-typography-label);font-weight:600;white-space:nowrap;box-shadow:3px 3px 0 var(--shadow-ink);transition:transform var(--dp-motion-interaction),box-shadow var(--dp-motion-interaction)}
.hbtn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow-ink)}
.hbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow-ink)}
#menuBtn{display:none}
#menuBtn .i-x{display:none}
header.open #menuBtn .i-menu{display:none} header.open #menuBtn .i-x{display:inline}
nav{position:relative;margin-top:14px}
nav ul{list-style:none;margin:0 0 0 -8px;padding:0;display:flex;gap:0;overflow:hidden;white-space:nowrap}
nav button{background:none;border:0;color:var(--muted);padding:9px 8px 13px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:var(--dp-typography-label);font-weight:600}
nav button:hover{color:var(--dp-color-ink)}
nav button[aria-current="page"]{color:var(--dp-color-ink);font-weight:700}
#bar{position:absolute;bottom:-3px;height:6px;background:var(--dp-color-accent);border:2px solid var(--dp-color-outline);border-radius:6px 6px 0 0;transition:left .25s,width .25s}
nav.noicons button .i{display:none}
header.collapsed{position:sticky;top:0}
header.collapsed .htop{padding:10px 0}
header.collapsed .htop h1{font-size:19px}
header.collapsed .htop h1 small{display:none}
header.collapsed .hbtn{padding:7px 9px}
header.collapsed .hbtn .lbl{display:none}
header.collapsed #menuBtn{display:inline-flex}
header.collapsed nav{display:none;margin-top:4px;padding-bottom:12px}
header.collapsed.open nav{display:block}
header.collapsed nav ul{flex-direction:column;overflow:visible;margin:0}
header.collapsed nav button{width:100%;padding:10px 4px;font-size:16px}
header.collapsed #bar{display:none}
main.wrap{padding-top:36px;padding-bottom:80px}
/* superficies: el libro */
.card{position:relative;background:var(--dp-color-panel);border:var(--dp-border-outline-width) solid var(--dp-color-outline);border-radius:var(--dp-radius-corner);padding:22px;box-shadow:6px 6px 0 var(--dp-color-accent)}
.muted{color:var(--muted)}
h2{font-size:clamp(30px,4vw,40px);line-height:1.05;margin:0 0 12px;font-weight:800}
h3{margin:0}
p{max-width:68ch}
.row{display:flex;gap:var(--dp-spacing-gap-compact);flex-wrap:wrap;align-items:center}
.mt{margin-top:18px}
/* filtros por tema */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 22px}
.chip{border:var(--dp-border-detail-width) solid var(--dp-color-outline);background:var(--dp-color-panel);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:var(--dp-typography-label);font-weight:600;display:inline-flex;gap:7px;align-items:center;transition:transform var(--dp-motion-interaction),box-shadow var(--dp-motion-interaction)}
.chip .i{display:none}
.chip::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--c,var(--dp-color-ink));border:2px solid var(--dp-color-outline);flex:none}
.chip:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--shadow-ink)}
.chip[aria-pressed="true"]{background:var(--dp-color-selection);box-shadow:3px 3px 0 var(--dp-color-accent)}
/* acciones */
.btn{border:var(--dp-border-outline-width) solid var(--dp-color-outline);border-radius:999px;padding:9px 20px;cursor:pointer;background:var(--dp-color-accent);color:var(--on-accent);font-weight:700;display:inline-flex;gap:7px;align-items:center;box-shadow:4px 4px 0 var(--shadow-ink);transition:transform var(--dp-motion-interaction),box-shadow var(--dp-motion-interaction)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow-ink)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow-ink)}
.btn.sec{background:var(--dp-color-panel);color:var(--dp-color-ink)}
.btn.ok{background:var(--dp-color-accent-fresh);color:#1b2a22} .btn.bad{background:var(--dp-color-accent-secondary);color:#2a1222}
.btn[disabled]{cursor:not-allowed;box-shadow:none;transform:none}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:var(--dp-typography-metadata);font-weight:700;color:var(--dp-color-ink);background:var(--dp-color-ground);border:var(--dp-border-detail-width) solid var(--dp-color-outline);border-radius:999px;padding:2px 10px 2px 6px}
.tag .i{display:none}
.tag::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--c);border:2px solid var(--dp-color-outline)}
/* tarjeta de memoria */
.flip{backface-visibility:hidden;will-change:transform;min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;font-size:20px;line-height:1.5;padding:40px 28px 32px;margin-top:22px}
.flip .side{position:absolute;top:-17px;left:22px;font:700 var(--dp-typography-label)/1 var(--dp-typography-reading);background:var(--dp-color-accent-warm);color:#2a2410;border:var(--dp-border-detail-width) solid var(--dp-color-outline);border-radius:10px 10px 4px 4px;padding:7px 12px}
/* opciones */
.opts{display:grid;gap:10px;margin-top:16px}
.opt{border:var(--dp-border-detail-width) solid var(--dp-color-outline);background:var(--dp-color-panel);border-radius:14px;padding:11px 14px;text-align:left;cursor:pointer;display:flex;gap:13px;align-items:center;transition:transform var(--dp-motion-interaction),box-shadow var(--dp-motion-interaction)}
.opt:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--shadow-ink)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:var(--dp-border-detail-width) solid var(--dp-color-outline);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--dp-color-ground)}
.opt.sel{background:var(--dp-color-selection);box-shadow:3px 3px 0 var(--dp-color-accent)}
.opt.sel .k{background:var(--dp-color-accent);color:var(--on-accent)}
.opt.right{background:var(--dp-color-field-soft);box-shadow:3px 3px 0 #22b97f} .opt.right .k{background:var(--dp-color-accent-fresh);color:#1b2a22}
.opt.wrong{background:var(--bad-soft);box-shadow:3px 3px 0 var(--dp-color-accent-secondary)} .opt.wrong .k{background:var(--dp-color-accent-secondary);color:#2a1222}
.fb{margin-top:16px;border:var(--dp-border-detail-width) solid var(--dp-color-outline);border-radius:14px;padding:12px 16px}
.fb.ok{background:var(--dp-color-field-soft)} .fb.bad{background:var(--bad-soft)}
.sig{display:block;font-size:var(--dp-typography-metadata);color:var(--muted);margin-top:4px}
.prog{height:14px;background:var(--dp-color-panel);border:var(--dp-border-detail-width) solid var(--dp-color-outline);border-radius:999px;overflow:hidden;margin:0 0 20px}
.prog span{display:block;height:100%;background:var(--dp-color-accent-warm);border-right:var(--dp-border-detail-width) solid var(--dp-color-outline)}
input[type=text]{width:100%;border:var(--dp-border-detail-width) solid var(--dp-color-outline);background:var(--dp-color-ground);border-radius:14px;padding:11px 14px;font-size:17px}
input[type=text]:focus-visible{outline-offset:3px}
input[type=checkbox]{accent-color:var(--dp-color-accent);width:18px;height:18px}
.ord{padding:0;margin:14px 0}
.ord li{list-style:none;display:flex;gap:8px;align-items:center;border:var(--dp-border-detail-width) solid var(--dp-color-outline);border-radius:14px;padding:7px 8px 7px 14px;margin:8px 0;background:var(--dp-color-panel)}
.ord li span{flex:1}
.ord li.right{background:var(--dp-color-field-soft)} .ord li.wrong{background:var(--bad-soft)}
.ib{border:var(--dp-border-detail-width) solid var(--dp-color-outline);background:var(--dp-color-ground);border-radius:50%;width:34px;height:34px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:var(--dp-color-selection)}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-top:14px}
.mi{border:var(--dp-border-detail-width) solid var(--dp-color-outline);background:var(--dp-color-panel);border-radius:14px;padding:9px 12px;cursor:pointer;text-align:left;width:100%;margin-bottom:9px;font-size:15px}
.mi.sel{background:var(--dp-color-selection);box-shadow:3px 3px 0 var(--dp-color-accent)}
.mi.done{background:var(--dp-color-ground);color:var(--muted)} .mi.right{background:var(--dp-color-field-soft);color:var(--dp-color-ink)} .mi.wrong{background:var(--bad-soft);color:var(--dp-color-ink)}
.pairn{display:inline-flex;width:21px;height:21px;border-radius:50%;background:var(--dp-color-accent-warm);color:#2a2410;border:2px solid var(--dp-color-outline);font-size:11px;font-weight:800;align-items:center;justify-content:center;margin-right:7px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:var(--dp-border-detail-width) solid var(--dp-color-rule-muted);vertical-align:top}
th{font-size:var(--dp-typography-label);font-weight:700}
.big{font:800 88px/1 var(--dp-typography-display);letter-spacing:-.03em}
.big small{font-size:28px;color:var(--muted);font-weight:700}
.warnline{background:var(--warn-soft);border:var(--dp-border-detail-width) solid var(--dp-color-outline);border-radius:var(--dp-radius-corner);padding:14px 18px;font-size:15px}
/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:36px;align-items:center;padding:14px 0 8px}
.hero h2{font-size:clamp(44px,6.6vw,92px);line-height:.95;letter-spacing:-.035em;margin-bottom:20px}
.hero p{margin:0 0 10px;font-size:17px}
.net{width:100%;height:auto;display:block;overflow:visible}
.net .pl{stroke:var(--dp-color-outline);stroke-width:3}
.net .shd{fill:var(--shadow-ink)}
.net .arc{stroke:var(--dp-color-outline);stroke-width:2;fill:none}
.net .tr{fill:var(--dp-color-accent-warm);stroke:var(--dp-color-outline);stroke-width:3}
.net text{font-family:var(--dp-typography-reading);fill:var(--dp-color-ink)}
.net .lab{font-family:var(--dp-typography-display);font-size:18px;font-weight:800}
.net .sub{font-size:14px;fill:var(--muted)}
.net .tok{fill:var(--dp-color-outline)}
.facts{position:relative;margin-top:26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--dp-color-panel);border:var(--dp-border-outline-width) solid var(--dp-color-outline);border-radius:var(--dp-radius-corner);box-shadow:6px 6px 0 var(--dp-color-accent-fresh)}
.facts div{padding:14px 18px;font-size:var(--dp-typography-label);color:var(--muted)}
.facts div+div{border-left:var(--dp-border-detail-width) solid var(--dp-color-outline)}
.facts b{display:block;font:800 28px/1.1 var(--dp-typography-display);color:var(--dp-color-ink);letter-spacing:-.02em}
.book{margin-top:54px;padding:34px 28px 26px}
.book .tab{position:absolute;top:-19px;left:26px;background:var(--dp-color-accent-secondary);color:#2a1222;border:var(--dp-border-outline-width) solid var(--dp-color-outline);border-radius:12px 12px 4px 4px;padding:5px 14px;font:800 15px/1.2 var(--dp-typography-display)}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.groups h3{font-size:22px}
.groups .hint{font-size:var(--dp-typography-label);color:var(--muted);margin:2px 0 12px}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.mrow{display:flex;align-items:center;gap:10px;width:100%;border:var(--dp-border-detail-width) solid var(--dp-color-outline);border-radius:14px;background:var(--dp-color-panel);padding:9px 12px;cursor:pointer;text-align:left;transition:transform var(--dp-motion-interaction),box-shadow var(--dp-motion-interaction)}
.mrow:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--dp-color-accent);background:var(--dp-color-selection)}
.mrow:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--dp-color-accent)}
.mrow b{font-weight:700}
.mrow .n{margin-left:auto;font-size:var(--dp-typography-metadata);font-weight:700;background:var(--dp-color-ground);border:2px solid var(--dp-color-outline);border-radius:999px;padding:0 8px}
.mrow .n:empty{display:none}
.g1 h3::before,.g2 h3::before,.g3 h3::before{content:"";display:inline-block;width:14px;height:14px;margin-right:9px;border:2.5px solid var(--dp-color-outline);vertical-align:1px}
.g1 h3::before{background:var(--dp-color-accent-fresh);border-radius:50%}
.g2 h3::before{background:var(--dp-color-accent-warm);border-radius:3px}
.g3 h3::before{background:var(--dp-color-accent-secondary);border-radius:14px 14px 3px 3px}
@media (max-width:1100px){ .hero{gap:24px} .groups{gap:20px} }
@media (max-width:760px){ .hero{grid-template-columns:1fr} .groups{grid-template-columns:1fr} .facts{grid-template-columns:1fr 1fr} .facts div:nth-child(3){grid-column:1/-1;border-left:0;border-top:var(--dp-border-detail-width) solid var(--dp-color-outline)} .card{box-shadow:4px 4px 0 var(--dp-color-accent);padding:18px} .book{padding:30px 16px 18px} .mcols{grid-template-columns:1fr} .flip{font-size:18px} }
@media (max-width:420px){ .hero h2{font-size:40px} h2{font-size:28px} .btn{padding:8px 16px} .big{font-size:68px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} .btn:hover,.btn:active,.hbtn:hover,.hbtn:active,.chip:hover,.opt:hover,.mrow:hover,.mrow:active{transform:none} }
</style>
</head>

<script>
const CARDS = [
  ["petri", "¿Quién creó las Redes de Petri y para qué tipo de sistemas sirven?", "Carl Adam Petri. Para describir sistemas con concurrencia, sincronización, exclusión mutua y conflictos, típicos de los sistemas distribuidos."],
  ["petri", "¿Cuál es el límite de las máquinas de estado que superan las Redes de Petri?", "No modelan bien acciones simultáneas: unir varias máquinas multiplica los estados. Las Redes de Petri tienen paralelismo inherente."],
  ["petri", "¿Cuáles son los elementos de una Red de Petri y cómo se dibujan?", "Lugares (círculos), transiciones (barras), arcos dirigidos con peso y marcas (puntos negros en los lugares)."],
  ["petri", "¿Qué representan los lugares y las transiciones al modelar?", "Los lugares, condiciones o estados; las transiciones, eventos o sucesos. Una marca indica que la condición se cumple."],
  ["petri", "¿Por qué una Red de Petri es un multígrafo dirigido bipartito?", "Admite arcos múltiples, los arcos tienen dirección y los nodos se dividen en dos clases (lugares y transiciones) que solo se conectan entre sí."],
  ["petri", "Definición formal de la estructura de una Red de Petri", "C = (P, T, I, O): conjunto finito de lugares, conjunto finito de transiciones, función de entrada y función de salida."],
  ["petri", "¿Qué es el marcado de una red?", "Una función de los lugares en los enteros no negativos (o un vector) que indica cuántas marcas hay en cada lugar. Es el estado de la red."],
  ["petri", "¿Qué es una red ordinaria, una generalizada y una pura?", "Ordinaria: todos los arcos pesan 1. Generalizada: arcos con cualquier peso entero. Pura: ningún lugar es entrada y salida de la misma transición."],
  ["petri", "¿Cuándo está habilitada una transición?", "Cuando cada lugar de entrada tiene al menos tantas marcas como el peso del arco hacia la transición: M(p) ≥ I(p, t)."],
  ["petri", "Ecuación del nuevo marcado al disparar t", "M'(p) = M(p) − Pre(p, t) + Post(t, p) para todo lugar p."],
  ["petri", "¿Qué es una transición fuente y una transición sumidero?", "Fuente: sin lugares de entrada, siempre habilitada. Sumidero: sin lugares de salida, elimina marcas de la red."],
  ["petri", "¿Por qué disparar una transición puede deshabilitar a otra?", "Porque las marcas son indivisibles: una marca la quita una sola transición, y si comparten lugar de entrada la otra se queda sin marca."],
  ["petri", "¿Qué es un marcado alcanzable?", "Uno al que se llega desde otro mediante una secuencia de disparos. Si basta un disparo, es inmediatamente alcanzable."],
  ["petri", "¿Qué representa el árbol de alcanzabilidad?", "Todos los marcados alcanzables desde M0: cada nodo es un marcado y cada arco, la transición disparada."],
  ["petri", "¿Dónde se deja de expandir el árbol de alcanzabilidad?", "En los nodos frontera: marcados muertos, nodos duplicados y marcados que solo tienen más marcas en algún lugar (se escribe w)."],
  ["petri", "¿Qué significa una w en el árbol de alcanzabilidad?", "Que un lugar puede tener una cantidad ilimitada de marcas: la red no es acotada."],
  ["petri", "¿Qué contienen las matrices C⁻, C⁺ y C?", "C⁻ (incidencia previa) la función de entrada; C⁺ (incidencia posterior) la de salida; C = C⁺ − C⁻ es la matriz de incidencia."],
  ["petri", "Según la lectura, ¿qué son las filas y las columnas de la matriz de incidencia?", "Filas = transiciones; columnas = lugares."],
  ["petri", "Diferencia entre distribución y conjunción", "Distribución: una transición con varios lugares de salida (lanza procesos paralelos). Conjunción: una transición con varios lugares de entrada (sincroniza)."],
  ["petri", "¿Qué es un conflicto en una Red de Petri?", "Dos transiciones habilitadas comparten un lugar de entrada y disparar una deshabilita a la otra."],
  ["petri", "Propiedades estructurales frente a propiedades de comportamiento", "Las estructurales dependen solo de la topología; las de comportamiento dependen del marcado inicial."],
  ["petri", "¿Cuándo una red es viva?", "Cuando, desde cualquier marcado alcanzable, todas sus transiciones pueden volver a dispararse. Garantiza que no hay bloqueo total (deadlock)."],
  ["petri", "¿Qué es una red parcialmente viva?", "Siempre hay alguna transición disparable, pero alguna transición no es viva."],
  ["petri", "¿Qué es una red k-acotada y una red segura?", "k-acotada: ningún lugar supera k marcas. Segura: 1-acotada, también llamada binaria."],
  ["petri", "¿Qué es la ciclicidad o reversibilidad?", "Que desde cualquier marcado alcanzable se puede volver al marcado inicial M0."],
  ["petri", "¿Qué es una red conservativa?", "Una red en la que la cantidad total de marcas se mantiene constante."],
  ["petri", "¿Cómo se modela la exclusión mutua?", "Con un lugar 'recurso libre' con una marca (semáforo): el primer proceso la quita y los demás esperan. No tiene prioridades."],
  ["petri", "Productor y consumidor con buffer finito", "Se usan lugares 'buffers llenos' y 'buffers vacíos' cuyas marcas siempre suman la capacidad del depósito."],
  ["petri", "Lectores y escritores", "Semáforo con m marcas y arcos de peso m: leer toma una marca (lecturas concurrentes) y escribir toma las m (escritura excluyente)."],
  ["petri", "Cinco filósofos: problema y solución", "Si todos toman primero el mismo tenedor, nadie come (estancamiento). Solución: tomar los dos tenedores a la vez o limitar a 4 los que intentan comer."],
  ["petri", "Ventajas de las Redes de Petri", "Fáciles de interpretar, modelan procesos concurrentes y recursos compartidos, más exactas que un diagrama de estados, se construyen top-down o bottom-up."],
  ["petri", "Desventajas de las Redes de Petri", "No modelan prioridades, el análisis se complica con sistemas complejos y a mayor modelo, mayor consumo."],
  ["petri", "Verificación frente a validación de una Red de Petri", "Ejecutar la red simula el sistema y logra una verificación; una validación exige un lenguaje más formal."],
  ["petri", "Ejemplo de 5 lugares de la lectura: ¿qué propiedades tiene?", "5 marcados alcanzables, ninguno muerto: viva, segura y cíclica. t2 y t3 son concurrentes; t4 y t5 están en conflicto."],
  ["bi", "¿Cuál es el objetivo básico de BI? (Siglas: BI = Inteligencia de negocio.)", "Apoyar de forma sostenible y continuada a las organizaciones para mejorar su competitividad, facilitando información para tomar decisiones."],
  ["bi", "¿Quién popularizó el término Business Intelligence?", "Howard Dresner, cuando era consultor de Gartner."],
  ["bi", "Definición de BI de Gartner (Siglas: BI = Inteligencia de negocio.)", "Proceso interactivo para explorar y analizar información estructurada sobre un área (normalmente en un datawarehouse) para descubrir tendencias o patrones; incluye comunicar y efectuar cambios."],
  ["bi", "¿Por qué BI es un 'proceso interactivo'? (Siglas: BI = Inteligencia de negocio.)", "Porque es un análisis continuado en el tiempo, no puntual: permite ver tendencias, cambios y variabilidad."],
  ["bi", "¿Qué incluyen el back end y el front end de BI según el TDWI? (Siglas: BI = Inteligencia de negocio.)", "Back end ('trastienda'): datawarehousing. Front end ('mostrador'): consultas, informes, análisis y herramientas para mostrar información."],
  ["bi", "Ventas en baja en el supermercado: ¿qué se analiza?", "Si bajó la cantidad de tickets (afluencia: promocionar el local) o el ticket medio (compran menos: que compren más), o ambos."],
  ["bi", "Dato de los hospitales de Estados Unidos", "Los analistas dedican el 80 % del tiempo a preparar datos en Excel y solo el 20 % a analizar. Debería ser al revés."],
  ["bi", "¿Qué porcentaje de directivos confía en sus informes, según IDC? (Siglas: IDC = International Data Corporation, consultora.)", "Solo el 15 %."],
  ["bi", "Tipos de beneficios de BI (Siglas: BI = Inteligencia de negocio.)", "Tangibles (ingresos y costos), intangibles (satisfacción, información precisa) y estratégicos (formular la estrategia)."],
  ["bi", "Los 6 componentes de un proyecto de BI", "Problemática, equipo, información interna, información externa, datawarehouse y aplicación de BI."],
  ["bi", "¿Para qué necesitan información las organizaciones (nota técnica 1)?", "Para soportar transacciones, para tomar decisiones y controlar, y para nuevos negocios."],
  ["bi", "Pregunta estructurada frente a no estructurada", "Estructurada: se responde con sí, no o un valor (¿entregamos a tiempo?). No estructurada: requiere criterio (¿lanzamos el producto Y en el mercado Z?)."],
  ["bi", "Fórmulas del ROI", "Simple: valor para el negocio / costo del proyecto. Completa: NPV / inversión inicial × 100."],
  ["bi", "¿Qué incluye el TCO? (Siglas: TCO = Costo total de propiedad.)", "Hardware, software, consultoría, personal, lanzamiento, mantenimiento y formación."],
  ["bi", "Datos del ejemplo de ROI del libro", "Inversión 40.000 €, mantenimiento 15.000 € por año, tasa 15 %: NPV 87.656 € y ROI 219 %."],
  ["bi", "Estudio IDC 1996 sobre datawarehousing (Siglas: IDC = International Data Corporation, consultora.)", "ROI medio a 3 años de 401 % y payback de 2,3 años."],
  ["bi", "¿Qué es un modelo de negocio?", "Una simplificación de la realidad para documentar, probar y desarrollar teorías sobre el negocio y experimentar cómo afectan los cambios al resultado."],
  ["bi", "¿Qué son los silos de información?", "Departamentos entre los que no fluye la información, por falta de integración o por razones políticas."],
  ["bi", "Paquetería: ¿qué rutas conviene potenciar?", "Las de baja ocupación del camión, porque el resultado depende del precio y de la ocupación."],
  ["bi", "Metodologías para crear un modelo de negocio", "Contabilidad analítica o de costos, EFQM, Six Sigma, análisis de procesos, modelos financieros y análisis de ratios."],
  ["bi", "¿Para qué sirven los KPI? (Siglas: KPI = Indicador clave de desempeño.)", "Para evaluar si la organización alcanza sus objetivos y medir su progreso."],
  ["bi", "Requisitos de un KPI (Siglas: KPI = Indicador clave de desempeño.)", "Reflejar los objetivos, ser críticos, ser cuantificables y comparables y permitir acciones correctivas."],
  ["bi", "Ejemplo de KPI del libro (Siglas: KPI = Indicador clave de desempeño.)", "Repetición de ventas a clientes: objetivo mejorar 3 % por trimestre partiendo del 48 %."],
  ["bi", "¿Quién creó el modelo relacional y cuándo?", "E. F. Codd, en 1970."],
  ["bi", "Tabla de hechos frente a tabla de dimensiones", "Hechos: lo que se quiere medir. Dimensiones: cómo se quiere medir (contexto para agrupar y filtrar)."],
  ["bi", "¿Qué preguntas responden las dimensiones?", "¿Qué? ¿Quién? ¿Por qué? ¿Dónde? ¿Cuándo?"],
  ["bi", "¿Qué es una dimensión degenerada?", "Una dimensión que no necesita tabla propia, como el número de ticket o el identificador de caja."],
  ["bi", "Esquema estrella", "Una tabla de hechos y una tabla desnormalizada por dimensión; solo hay relaciones hechos-dimensiones. Tiene redundancia."],
  ["bi", "Esquema copo de nieve", "Dimensiones normalizadas con relaciones entre ellas (por ejemplo, Zona aparte de Centro). Sin redundancia, más complejo."],
  ["bi", "¿Qué es una constelación de hechos?", "Varios esquemas estrella con distintas tablas de hechos que comparten dimensiones (también llamado galaxia)."],
  ["bi", "¿Qué es la granularidad?", "El nivel de detalle. Analizar líneas de ticket es mayor granularidad que analizar tickets. Al agregar se pierde información."],
  ["bi", "¿Qué es la multidimensionalidad?", "Analizar la información por varias dimensiones a la vez, por ejemplo ventas de un artículo por centro y por mes."],
  ["bi", "¿Qué es la metadata o diccionario de datos?", "La descripción de atributos, origen, definiciones y transformaciones, para que todos usen la misma terminología."],
  ["bi", "¿Qué hace el proceso ETL?", "Extrae, transforma y carga: antes de cargar el datawarehouse los datos se transforman, limpian, filtran y redefinen."],
  ["bi", "Data Mart frente a datawarehouse", "El Data Mart es más chico: sirve a una comunidad de usuarios y a pocas áreas."],
  ["bi", "Productores y consumidores de información", "Productores (alrededor del 20 %): estadísticos y autores de informes. Consumidores: la mayoría, directivos que usan cuadros de mando."],
  ["dm", "¿Qué es la minería de datos?", "Métodos y algoritmos para la extracción automática de información que caracteriza relaciones escondidas en grandes volúmenes de datos, con capacidad predictiva."],
  ["dm", "Minería de datos frente a monitoreo", "La minería trabaja con datos estáticos y descubre; el monitoreo trabaja con datos cambiantes en tiempo real y reconoce patrones."],
  ["dm", "Definición de KDD", "Extracción no trivial de información implícita, previamente desconocida y potencialmente útil a partir de un conjunto de datos."],
  ["dm", "¿Desde cuándo se usa el término KDD? (Siglas: KDD = Descubrimiento de conocimiento en bases de datos.)", "Desde 1989."],
  ["dm", "KDD frente a minería de datos", "El KDD es el proceso completo; la minería es solo la etapa de descubrimiento dentro de él."],
  ["dm", "Las cuatro ideas que diferencian al KDD (Siglas: KDD = Descubrimiento de conocimiento en bases de datos.)", "Lenguaje de alto nivel, precisión, interés y eficiencia."],
  ["dm", "¿Por qué las redes neuronales quedan fuera del criterio de lenguaje de alto nivel?", "Porque su conocimiento queda en miles de pesos numéricos: es una caja negra que no se puede explicar."],
  ["dm", "¿Cuál es el paso crítico del KDD?", "La transformación y reducción de los datos (paso 4): marca el éxito o fracaso de la minería."],
  ["dm", "Tres factores que impulsaron el análisis de datos", "Mayor potencia de las computadoras, mayor ritmo de adquisición de datos y nuevos métodos de aprendizaje."],
  ["dm", "Aprendizaje automático frente a minería", "El aprendizaje automático usa un conjunto chico y seleccionado; la minería, una base grande generada para otros propósitos."],
  ["dm", "Picapedreros frente a exploradores", "Picapedreros o granjeros: informes periódicos y control de valores. Exploradores: buscan patrones nuevos con minería."],
  ["dm", "Limpieza frente a criba", "Limpieza: elimina datos erróneos o inconsistentes. Criba: elimina datos irrelevantes."],
  ["dm", "Minería dirigida frente a no dirigida", "Dirigida: se sabe qué se busca (predecir). No dirigida: no se sabe qué se busca."],
  ["dm", "Las dos fases de evaluación y validación", "Primero, probar la precisión en un banco de ejemplos independiente; después, una experiencia piloto."],
  ["dm", "¿Por qué filtrar filas con faltantes o atípicos es peligroso?", "Porque sesga los datos: las causas del dato raro suelen estar relacionadas con casos especiales."],
  ["dm", "¿Qué hacer con atípicos sin perderlos?", "Discretizar (caen en 'muy alto' o 'muy bajo'), reemplazarlos o usar algoritmos robustos como los árboles."],
  ["dm", "Tres razones de los datos faltantes", "Relevantes (no dar el teléfono), no existentes (cliente nuevo sin historial) e incompletos (unión de fuentes)."],
  ["dm", "Minería de datos frente a estadística", "La minería es automática, exploratoria, usa inteligencia artificial y es menos restrictiva; la estadística es manual y confirmatoria."],
  ["dm", "¿Por qué la minería no es OLAP?", "OLAP navega los datos de forma asistida pero no genera información nueva."],
  ["dm", "MOLAP frente a ROLAP", "MOLAP: bases multidimensionales con datos precompilados, para soluciones chicas. ROLAP: sobre bases relacionales, traduce a SQL, más flexible."],
  ["dm", "Segundo reto: el ejemplo de Florida", "Florida tiene la edad al fallecer más alta porque allí se jubilan los mayores: correlación no es causalidad."],
  ["dm", "Tercer reto de la minería", "Tiempo, espacio y privacidad: variables que cambian, granularidad del tiempo y combinación de bases de datos personales."],
  ["dm", "Las seis tareas de la minería", "Agrupamiento, clasificación, condensación, detección de desviaciones, modelado de dependencias y regresión."],
  ["dm", "Predictivo frente a descriptivo", "Predictivo (supervisado): predice una etiqueta conocida, con entrenamiento y prueba. Descriptivo (no supervisado): descubre patrones sin etiquetas."],
  ["dm", "Confianza y soporte de una regla", "Confianza: casos con antecedente y consecuente sobre casos con antecedente. Soporte: casos en que se aplica la regla."],
  ["dm", "Las dos fases de Apriori", "A: buscar conjuntos frecuentes con soporte suficiente. B: partirlos en reglas y quedarse con las de confianza suficiente."],
  ["dm", "Boosting frente a voting", "Boosting: el mismo algoritmo sobre distintas particiones. Voting: distintos algoritmos sobre todos los datos."],
  ["dm", "CART frente a CHAID", "CART parte cada nodo en 2 (índice de Gini); CHAID parte en más de 2 (test Ji cuadrado)."],
  ["dm", "¿Para qué se usan los algoritmos genéticos?", "Para optimizar; en minería, al principio, para elegir las variables."],
  ["dm", "Tres medidas clave de una herramienta de minería", "Precisión, explicación e integración."],
  ["dm", "¿Qué es la elevación (lift)?", "Cuánto mejora la respuesta respecto del azar. Ejemplo: 30 % con el modelo / 10 % al azar = 3."],

  ["dm", "¿Cuál metodología es la más orientada al negocio?", "CRISP-DM."],
  ["dm", "Características de una bodega de datos", "Consolidada, consistente, orientada a un tema, histórica y de solo lectura."],
  ["bd", "Las 3 V del Big Data", "Volumen, velocidad y variedad."],
  ["bd", "¿De qué nuevas necesidades nace el Big Data?", "Personalización máxima del cliente, el paso de la transacción a la interacción y nuevos dispositivos con sensores."],

  ["bd", "Claves de implementación de Big Data", "Medir el valor para el negocio, que las metas determinen la tecnología y tener perfiles y herramientas adecuados."],

  ["petri", "¿Cuándo surgieron las Redes de Petri?", "En 1962, con la tesis doctoral de Carl Adam Petri, Kommunikation mit Automaten, en Alemania."],

  ["petri", "Conflicto estructural frente a conflicto efectivo", "Estructural: un lugar tiene más de una transición de salida. Efectivo: un marcado alcanzable habilita a las dos y disparar una deshabilita a la otra."],

  ["petri", "¿Qué entra de Redes de Petri en el parcial además de la teoría?", "Árbol de alcanzabilidad, características y propiedades, y resolver una red con máquina de testigos y método matricial."],
  ["petri", "Receta para resolver una red en el examen", "1) Leer P, T, pesos y M0. 2) Armar C⁻, C⁺ y C = C⁺ − C⁻. 3) Árbol de alcanzabilidad. 4) Máquina de testigos. 5) Comprobar secuencias con M' = M + f(σ)·C. 6) Leer las propiedades."],
  ["petri", "¿Cómo se pasa del árbol de alcanzabilidad a la máquina de testigos?", "Se juntan los nodos duplicados y queda el grafo de marcados; cada estado (óvalo) lleva los nombres de los lugares marcados, repetidos tantas veces como marcas tengan."],
  ["petri", "¿Cuándo se escribe ω en el árbol y qué indica?", "Cuando un marcado nuevo cubre a un antecesor del mismo camino (igual o más marcas en todos los lugares y más en alguno). En esos lugares va ω; indica que la red no es acotada. ω + 1 = ω y ω − 1 = ω."],
  ["petri", "¿Cómo se verifica con el método matricial que tj está habilitada?", "M ≥ ej·C⁻: el marcado tiene que tener al menos la fila de tj de la matriz de entradas."],
  ["petri", "¿Cómo se lee en el grafo de marcados si la red es viva y si es cíclica?", "Viva: no hay marcados muertos y desde cualquier estado se puede volver a disparar cada transición. Cíclica: desde todos los estados se puede volver a M0."],

/* tarjetas */
var tc={i:0,flip:false,deck:[],only:false,anim:false};
function buildDeck(){var ts=selTopics();tc.deck=shuf(CARDS.map(function(c,i){return i;}).filter(function(i){return ts.indexOf(CARDS[i][0])>=0&&(!tc.only||!st.known[i]);}));tc.i=0;tc.flip=false;}
R.tarjetas=function(){buildDeck();drawCard();};
function drawCard(){var h="<h2>Tarjetas de memoria</h2>"+chips()+"<label class='row muted'><input type='checkbox' id='only' "+(tc.only?"checked":"")+"> Solo las que me faltan</label>";
  if(!tc.deck.length){main.innerHTML=h+"<div class='card mt'>No hay tarjetas para mostrar. ¡Las sabés todas!</div>";bindCardCtl();return;}
  var c=CARDS[tc.deck[tc.i]];
  h+="<p class='muted'>"+(tc.i+1)+" de "+tc.deck.length+"</p><div class='card flip' id='fl' role='button' tabindex='0' aria-label='Dar vuelta la tarjeta'><div>"+tag(c[0])+"</div><div class='side'"+(tc.flip?" style='background:var(--dp-color-accent-fresh);color:#1b2a22'":"")+">"+(tc.flip?"Respuesta":"Pregunta")+"</div><div>"+fmt(tc.flip?c[2]:c[1])+"</div></div>";
  h+="<div class='row mt'><button class='btn sec' id='prev'>"+ic("arrow-right").replace("class='i'","class='i' style='transform:scaleX(-1)'")+"Anterior</button><button class='btn ok' id='yes'>"+ic("check")+"La sé</button><button class='btn bad' id='no'>"+ic("refresh")+"Repasar</button><button class='btn sec' id='next'>Siguiente"+ic("arrow-right")+"</button></div>";
  main.innerHTML=h;bindCardCtl();
  var fl=document.getElementById("fl");
  function flip(){if(tc.anim)return;var still=!fl.animate||window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function swap(){tc.flip=!tc.flip;drawCard();var f=document.getElementById("fl");if(f){f.focus();if(!still)f.animate([{transform:"perspective(1800px) rotateY(-90deg)"},{transform:"perspective(1800px) rotateY(0deg)"}],{duration:220,easing:"cubic-bezier(.2,.8,.3,1.15)"});}}
    if(still){swap();return;}
    tc.anim=true;var a=fl.animate([{transform:"perspective(1800px) rotateY(0deg)"},{transform:"perspective(1800px) rotateY(90deg)"}],{duration:170,easing:"cubic-bezier(.5,0,.9,.6)",fill:"forwards"});
    a.onfinish=function(){tc.anim=false;swap();};}
  fl.onclick=flip;fl.onkeydown=function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}};
  document.getElementById("prev").onclick=function(){tc.i=(tc.i-1+tc.deck.length)%tc.deck.length;tc.flip=false;drawCard();};
  document.getElementById("next").onclick=function(){tc.i=(tc.i+1)%tc.deck.length;tc.flip=false;drawCard();};
  document.getElementById("yes").onclick=function(){st.known[tc.deck[tc.i]]=true;save("known",st.known);tc.i=(tc.i+1)%tc.deck.length;tc.flip=false;drawCard();};
  document.getElementById("no").onclick=function(){st.known[tc.deck[tc.i]]=false;save("known",st.known);tc.i=(tc.i+1)%tc.deck.length;tc.flip=false;drawCard();};}
function bindCardCtl(){bindChips(function(){buildDeck();drawCard();});var o=document.getElementById("only");if(o)o.onchange=function(){tc.only=o.checked;buildDeck();drawCard();};}

/* cuestionario y verdadero/falso */
function quiz(kind){var src=kind==="mcq"?MCQ:TF,title=kind==="mcq"?"Cuestionario":"Verdadero o falso";
  var q={list:[],i:0,ok:0,by:{},ans:false};
  function build(){var ts=selTopics();q.list=shuf(src.filter(function(x){return ts.indexOf(x[0])>=0;}));q.i=0;q.ok=0;q.by={};draw();}
  function draw(){var h="<h2>"+title+"</h2>"+chips();
    if(q.i>=q.list.length){h+="<div class='card'><p>Terminaste: <b>"+q.ok+" de "+q.list.length+"</b> correctas.</p><table><tr><th>Tema</th><th>Aciertos</th></tr>";
      Object.keys(q.by).forEach(function(t){h+="<tr><td>"+tag(t)+"</td><td>"+q.by[t].c+" / "+q.by[t].a+"</td></tr>";});
      h+="</table><div class='row mt'><button class='btn' id='again'>"+ic("refresh")+"Otra vez</button></div></div>";main.innerHTML=h;bindChips(build);document.getElementById("again").onclick=build;return;}
    var it=q.list[q.i];q.ans=false;
    var opts=kind==="mcq"?shuf(it[2].map(function(o,k){return {t:o,ok:k===0};})):[{t:"Verdadero",ok:it[2]===true},{t:"Falso",ok:it[2]===false}];
    h+="<div class='prog'><span style='width:"+(q.i*100/q.list.length)+"%'></span></div><div class='card'><div>"+tag(it[0])+" <span class='muted'>"+(q.i+1)+" / "+q.list.length+"</span></div><p style='font-size:17px'>"+fmt(it[1])+"</p><div class='opts'>";
    opts.forEach(function(o,k){h+="<button class='opt' data-k='"+k+"'><span class='k'>"+(k+1)+"</span><span>"+fmt(o.t)+"</span></button>";});
    h+="</div><div id='fb'></div></div>";main.innerHTML=h;bindChips(build);
    var bs=main.querySelectorAll(".opt");
    function pick(k){if(q.ans)return;q.ans=true;var good=opts[k].ok;bs.forEach(function(b,j){if(opts[j].ok)b.classList.add("right");else if(j===k)b.classList.add("wrong");});
      if(good)q.ok++;var b2=q.by[it[0]]||{a:0,c:0};b2.a++;if(good)b2.c++;q.by[it[0]]=b2;rec(it[0],good);
      var corr=opts.filter(function(o){return o.ok;})[0].t,g=glos(corr);
      document.getElementById("fb").innerHTML="<div class='fb "+(good?"ok":"bad")+"'><b>"+(good?"¡Correcto!":"Incorrecto. Era: "+esc(corr))+"</b>"+(g?" <span class='muted'>("+esc(g)+")</span>":"")+"<div>"+fmt(it[3])+"</div></div><div class='row mt'><button class='btn' id='nx'>Siguiente"+ic("arrow-right")+"</button></div>";
      var nx=document.getElementById("nx");nx.focus();nx.onclick=function(){q.i++;draw();};}
    bs.forEach(function(b,k){b.onclick=function(){pick(k);};});
    document.onkeydown=function(e){if(cur!==kind)return;var n=parseInt(e.key,10);if(n>=1&&n<=opts.length&&!q.ans)pick(n-1);};}
  build();}
R.mcq=function(){quiz("mcq");};
R.vf=function(){quiz("vf");};

/* completar */
R.completar=function(){var q={list:[],i:0};
  function build(){var ts=selTopics();q.list=shuf(CLOZE.filter(function(x){return ts.indexOf(x[0])>=0;}));q.i=0;draw();}
  function draw(){var h="<h2>Completar</h2>"+chips();if(q.i>=q.list.length){main.innerHTML=h+"<div class='card'>¡Listo! <button class='btn' id='again'>"+ic("refresh")+"Otra vez</button></div>";bindChips(build);document.getElementById("again").onclick=build;return;}
    var it=q.list[q.i];h+="<div class='card'><div>"+tag(it[0])+" <span class='muted'>"+(q.i+1)+" / "+q.list.length+"</span></div><p style='font-size:17px'>"+fmt(it[1]).replace("___","<b>____</b>")+"</p><input type='text' id='inp' autocomplete='off' placeholder='Escribí la respuesta y apretá Enter'><div id='fb'></div></div>";
    main.innerHTML=h;bindChips(build);var inp=document.getElementById("inp"),done=false;inp.focus();
    inp.onkeydown=function(e){if(e.key!=="Enter")return;if(done){q.i++;draw();return;}done=true;var v=norm(inp.value),good=it[2].some(function(a){return norm(a)===v;});rec(it[0],good);
      document.getElementById("fb").innerHTML="<div class='fb "+(good?"ok":"bad")+"'><b>"+(good?"¡Correcto!":"Respuesta esperada: "+esc(it[2][0]))+"</b></div><p class='muted'>Enter para seguir.</p>";};}
  build();};

/* ordenar */
R.ordenar=function(){var q={list:[],i:0,cur:[]};
  function build(){var ts=selTopics();q.list=shuf(ORDER.filter(function(x){return ts.indexOf(x[0])>=0;}));q.i=0;start();}
  function start(){if(q.i<q.list.length){var it=q.list[q.i],s;do{s=shuf(it[2]);}while(it[2].length>1&&s.join()===it[2].join());q.cur=s;}draw(false);}
  function draw(chk){var h="<h2>Ordenar</h2>"+chips();if(q.i>=q.list.length){main.innerHTML=h+"<div class='card'>¡Listo! <button class='btn' id='again'>"+ic("refresh")+"Otra vez</button></div>";bindChips(build);document.getElementById("again").onclick=build;return;}
    var it=q.list[q.i];h+="<div class='card'><div>"+tag(it[0])+"</div><p><b>"+fmt(it[1])+"</b></p><p class='muted'>Usá las flechas para mover cada paso.</p><ul class='ord'>";
    q.cur.forEach(function(s,k){var cls=chk?(s===it[2][k]?"right":"wrong"):"";h+="<li class='"+cls+"'><span>"+(k+1)+". "+fmt(s)+"</span><button class='ib' data-u='"+k+"' aria-label='Subir'>"+ic("arrow-right").replace("class='i'","class='i' style='transform:rotate(-90deg)'")+"</button><button class='ib' data-d='"+k+"' aria-label='Bajar'>"+ic("arrow-right").replace("class='i'","class='i' style='transform:rotate(90deg)'")+"</button></li>";});
    h+="</ul>";if(chk){var ok=q.cur.join("|")===it[2].join("|");h+="<div class='fb "+(ok?"ok":"bad")+"'><b>"+(ok?"¡Orden correcto!":"Orden correcto:")+"</b>"+(ok?"":"<ol>"+it[2].map(function(s){return "<li>"+fmt(s)+"</li>";}).join("")+"</ol>")+"</div><div class='row mt'><button class='btn' id='nx'>Siguiente"+ic("arrow-right")+"</button></div>";}
    else h+="<div class='row'><button class='btn' id='chk'>"+ic("check")+"Corregir</button></div>";
    main.innerHTML=h+"</div>";bindChips(build);
    main.querySelectorAll("[data-u]").forEach(function(b){b.onclick=function(){var k=+b.dataset.u;if(k>0){var x=q.cur[k];q.cur[k]=q.cur[k-1];q.cur[k-1]=x;}draw(false);};});
    main.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){var k=+b.dataset.d;if(k<q.cur.length-1){var x=q.cur[k];q.cur[k]=q.cur[k+1];q.cur[k+1]=x;}draw(false);};});
    var c=document.getElementById("chk");if(c)c.onclick=function(){rec(it[0],q.cur.join("|")===it[2].join("|"));draw(true);};
    var n=document.getElementById("nx");if(n)n.onclick=function(){q.i++;start();};}
  build();};

/* relacionar */
R.relacionar=function(){var q={list:[],i:0};
  function build(){var ts=selTopics();q.list=shuf(MATCH.filter(function(x){return ts.indexOf(x[0])>=0;}));q.i=0;start();}
  function start(){if(q.i<q.list.length){var p=q.list[q.i][2];q.L=shuf(p.map(function(x){return x[0];}));q.R=shuf(p.map(function(x){return x[1];}));q.pairs={};q.sel=null;q.chk=false;}draw();}
  function draw(){var h="<h2>Relacionar</h2>"+chips();if(q.i>=q.list.length){main.innerHTML=h+"<div class='card'>¡Listo! <button class='btn' id='again'>"+ic("refresh")+"Otra vez</button></div>";bindChips(build);document.getElementById("again").onclick=build;return;}
    var it=q.list[q.i],ans={};it[2].forEach(function(x){ans[x[0]]=x[1];});var Ls=Object.keys(q.pairs);
    h+="<div class='card'><div>"+tag(it[0])+"</div><p><b>"+fmt(it[1])+"</b></p><p class='muted'>Tocá un elemento de la izquierda y después su par. Tocá uno ya unido para deshacerlo.</p><div class='mcols'><div>";
    q.L.forEach(function(l){var n=Ls.indexOf(l),cls=q.sel===l?"sel":(n>=0?"done":"");if(q.chk&&n>=0)cls=(ans[l]===q.pairs[l])?"right":"wrong";h+="<button class='mi "+cls+"' data-l='"+esc(l)+"'>"+(n>=0?"<span class='pairn'>"+(n+1)+"</span>":"")+fmt(l)+"</button>";});
    h+="</div><div>";q.R.forEach(function(r){var l=Ls.filter(function(x){return q.pairs[x]===r;})[0],n=Ls.indexOf(l),cls=n>=0?"done":"";if(q.chk&&n>=0)cls=(ans[l]===r)?"right":"wrong";h+="<button class='mi "+cls+"' data-r='"+esc(r)+"'>"+(n>=0?"<span class='pairn'>"+(n+1)+"</span>":"")+fmt(r)+"</button>";});
    h+="</div></div>";
    if(q.chk){var good=it[2].every(function(x){return q.pairs[x[0]]===x[1];});h+="<div class='fb "+(good?"ok":"bad")+"'><b>"+(good?"¡Todo correcto!":"Pares correctos:")+"</b>"+(good?"":"<table>"+it[2].map(function(x){return "<tr><td>"+fmt(x[0])+"</td><td>"+fmt(x[1])+"</td></tr>";}).join("")+"</table>")+"</div><div class='row mt'><button class='btn' id='nx'>Siguiente"+ic("arrow-right")+"</button></div>";}
    else h+="<div class='row mt'><button class='btn' id='chk' "+(Ls.length<it[2].length?"disabled style='opacity:.5'":"")+">"+ic("check")+"Corregir</button></div>";
    main.innerHTML=h+"</div>";bindChips(build);
    if(!q.chk){main.querySelectorAll("[data-l]").forEach(function(b){b.onclick=function(){var l=b.dataset.l;if(q.pairs[l]!==undefined){delete q.pairs[l];q.sel=null;}else q.sel=(q.sel===l?null:l);draw();};});
      main.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){var r=b.dataset.r;var owner=Object.keys(q.pairs).filter(function(x){return q.pairs[x]===r;})[0];if(owner!==undefined){delete q.pairs[owner];draw();return;}if(q.sel){q.pairs[q.sel]=r;q.sel=null;draw();}};});
      var c=document.getElementById("chk");if(c)c.onclick=function(){if(Object.keys(q.pairs).length<it[2].length)return;q.chk=true;rec(it[0],it[2].every(function(x){return q.pairs[x[0]]===x[1];}));draw();};}
    else document.getElementById("nx").onclick=function(){q.i++;start();};}
  build();};

/* simulacro */
R.simulacro=function(){var qs=shuf(MCQ).slice(0,18).map(function(x){return {k:"m",it:x,opts:shuf(x[2].map(function(o,j){return {t:o,ok:j===0};}))};}).concat(shuf(TF).slice(0,7).map(function(x){return {k:"t",it:x,opts:[{t:"Verdadero",ok:x[2]===true},{t:"Falso",ok:x[2]===false}]};}));
  qs=shuf(qs);var an={},t0=Date.now();
  var h="<h2>Simulacro</h2><p class='muted'>25 preguntas (18 de opción múltiple y 7 de verdadero o falso), sin ayudas hasta el final. Tiempo: <b id='tm'>0:00</b></p>";
  qs.forEach(function(q,i){h+="<div class='card mt'><div>"+tag(q.it[0])+" <span class='muted'>"+(i+1)+" / 25</span></div><p>"+fmt(q.it[1])+"</p><div class='opts'>";q.opts.forEach(function(o,j){h+="<button class='opt' data-q='"+i+"' data-j='"+j+"'><span class='k'>"+(j+1)+"</span><span>"+fmt(o.t)+"</span></button>";});h+="</div><div id='e"+i+"'></div></div>";});
  h+="<div class='row mt'><button class='btn' id='fin'>"+ic("flag")+"Terminar y corregir</button></div><div id='res'></div>";main.innerHTML=h;
  timer=setInterval(function(){var s=Math.floor((Date.now()-t0)/1000),e=document.getElementById("tm");if(e)e.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");},1000);
  var fin=false;main.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(fin)return;var i=+b.dataset.q;an[i]=+b.dataset.j;main.querySelectorAll(".opt[data-q='"+i+"']").forEach(function(x){x.classList.toggle("sel",x===b);x.style.borderColor=x===b?"var(--dp-color-accent)":"";});};});
  document.getElementById("fin").onclick=function(){if(fin)return;fin=true;if(timer){clearInterval(timer);timer=null;}var ok=0;
    qs.forEach(function(q,i){var j=an[i],good=j!==undefined&&q.opts[j].ok;if(good)ok++;rec(q.it[0],good);main.querySelectorAll(".opt[data-q='"+i+"']").forEach(function(x,k){x.style.borderColor="";if(q.opts[k].ok)x.classList.add("right");else if(k===j)x.classList.add("wrong");});
      document.getElementById("e"+i).innerHTML="<div class='fb "+(good?"ok":"bad")+"'>"+fmt(q.it[3])+"</div>";});
    var n=ok*10/25;if(st.best===null||n>st.best){st.best=n;save("best",n);}
    document.getElementById("res").innerHTML="<div class='card mt' style='text-align:center'><div class='big'>"+n.toFixed(1)+"<small> / 10</small></div><p>"+ok+" de 25 correctas. Mejor nota: "+st.best.toFixed(1)+"</p><button class='btn' id='again'>"+ic("refresh")+"Otro simulacro</button></div>";
    document.getElementById("again").onclick=function(){go("simulacro");};document.getElementById("res").scrollIntoView({behavior:"smooth"});};};

/* siglas */
R.siglas=function(){var g={};GLOSARIO.forEach(function(s){(g[s[3]]=g[s[3]]||[]).push(s);});var h="<h2>Glosario de siglas</h2>";
  Object.keys(g).forEach(function(k){h+="<div class='card mt'><h3 style='margin:0 0 6px'>"+esc(k)+"</h3><table>";g[k].forEach(function(s){h+="<tr><td style='width:28%'><b>"+esc(s[0])+"</b></td><td>"+esc(s[1])+(s[2]?"<span class='sig'><i>"+esc(s[2])+"</i></span>":"")+"</td></tr>";});h+="</table></div>";});
  main.innerHTML=h;};

/* progreso */
R.progreso=function(){var h="<h2>Progreso</h2><div class='card'><table><tr><th>Tema</th><th>Aciertos</th><th>%</th><th>Tarjetas sabidas</th></tr>";
  Object.keys(TOP).forEach(function(t){var s=st.stats[t]||{a:0,c:0},tot=0,kn=0;CARDS.forEach(function(c,i){if(c[0]===t){tot++;if(st.known[i])kn++;}});
    h+="<tr><td>"+tag(t)+"</td><td>"+s.c+" / "+s.a+"</td><td>"+(s.a?Math.round(s.c*100/s.a):0)+" %</td><td>"+kn+" / "+tot+"</td></tr>";});
  h+="</table><p class='muted mt'>Mejor nota del simulacro: <b>"+(st.best===null?"—":st.best.toFixed(1))+"</b></p><button class='btn bad' id='rst'>"+ic("refresh")+"Reiniciar progreso</button></div>";
  main.innerHTML=h;document.getElementById("rst").onclick=function(){if(!confirm("¿Borrar todo el progreso?"))return;st.known={};st.stats={};st.best=null;save("known",{});save("stats",{});save("best",null);R.progreso();};};

fitNav();go("inicio");
})();
</script>
